{
  "$kind": "http-request",
  "name": "Create",
  "order": 100,
  "method": "POST",
  "url": "{{baseUrl}}/api/room",
  "auth": {
    "type": "noauth"
  },
  "headers": [
    {
      "key": "Content-Type",
      "value": "application/json"
    },
    {
      "key": "Authorization",
      "value": "Bearer {{dayToken}}"
    }
  ],
  "scripts": [
    {
      "type": "beforeRequest",
      "language": "text/javascript",
      "code": "pm.collectionVariables.set('dayToken',(pm.variables.replaceIn('{{$guid}}')+pm.variables.replaceIn('{{$guid}}')).replace(/-/g,''));"
    },
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('HTTP 200',()=>pm.response.to.have.status(200));const s=pm.response.json();if(s.room){pm.collectionVariables.set('voteCode',s.room.code);if(s.room.revision!==null)pm.collectionVariables.set('voteRevision',String(s.room.revision));if(s.game)pm.collectionVariables.set('voteStep',s.game.stepId??s.game.turn?.stepId??'');} "
    }
  ],
  "body": {
    "type": "json",
    "content": "{\"requestId\": \"req-1\", \"type\": \"create\", \"name\": \"Vote contract\"}"
  }
}
