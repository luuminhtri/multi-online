{
  "$kind": "http-request",
  "name": "Reject budget -1",
  "order": 900,
  "method": "POST",
  "url": "{{baseUrl}}/api/room",
  "auth": {
    "type": "noauth"
  },
  "headers": [
    {
      "key": "Content-Type",
      "value": "application/json"
    },
    {
      "key": "Authorization",
      "value": "Bearer {{dayToken}}"
    }
  ],
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('HTTP 400',()=>pm.response.to.have.status(400));pm.test('INVALID_SETTINGS',()=>pm.expect(pm.response.json().error.code).eql('INVALID_SETTINGS'));"
    }
  ],
  "body": {
    "type": "json",
    "content": "{\"code\": \"{{voteCode}}\", \"requestId\": \"req-9\", \"type\": \"start\", \"expectedRevision\": {{voteRevision}}, \"roles\": [\"wolf\", \"guard\", \"seer\", \"villager\", \"villager\", \"villager\", \"villager\"], \"settings\": {\"witchSeesBite\": true, \"skipVoteDays\": -1}}"
  }
}
