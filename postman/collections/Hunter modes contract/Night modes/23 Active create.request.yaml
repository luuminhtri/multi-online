{
  "$kind": "http-request",
  "name": "Active create",
  "order": 2300,
  "method": "POST",
  "url": "{{baseUrl}}/api/room",
  "auth": {
    "type": "noauth"
  },
  "headers": [
    {
      "key": "Content-Type",
      "value": "application/json"
    },
    {
      "key": "Authorization",
      "value": "Bearer {{hunterToken}}"
    }
  ],
  "scripts": [
    {
      "type": "beforeRequest",
      "language": "text/javascript",
      "code": "pm.collectionVariables.set('hunterToken',pm.variables.replaceIn('{{$guid}}').replace(/-/g,'')+pm.variables.replaceIn('{{$guid}}').replace(/-/g,''));"
    },
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('HTTP 200',()=>pm.response.to.have.status(200));const s=pm.response.json();if(s.room){pm.collectionVariables.set('hunterCode',s.room.code);if(s.room.revision!==null)pm.collectionVariables.set('hunterRevision',String(s.room.revision));}if(s.game){pm.collectionVariables.set('hunterStep',s.game.stepId??s.game.turn?.stepId??'');if(s.viewer==='moderator')for(const p of s.game.players)pm.collectionVariables.set('hunter_'+p.role,p.id);}"
    }
  ],
  "body": {
    "type": "json",
    "content": "{\"type\": \"create\", \"name\": \"Hunter test\", \"requestId\": \"hunter-23\"}"
  }
}
