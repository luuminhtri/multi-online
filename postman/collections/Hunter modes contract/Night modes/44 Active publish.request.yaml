{
  "$kind": "http-request",
  "name": "Active publish",
  "order": 4400,
  "method": "POST",
  "url": "{{baseUrl}}/api/room",
  "auth": {
    "type": "noauth"
  },
  "headers": [
    {
      "key": "Content-Type",
      "value": "application/json"
    },
    {
      "key": "Authorization",
      "value": "Bearer {{hunterToken}}"
    }
  ],
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('HTTP 200',()=>pm.response.to.have.status(200));const s=pm.response.json();if(s.room){pm.collectionVariables.set('hunterCode',s.room.code);if(s.room.revision!==null)pm.collectionVariables.set('hunterRevision',String(s.room.revision));}if(s.game){pm.collectionVariables.set('hunterStep',s.game.stepId??s.game.turn?.stepId??'');if(s.viewer==='moderator')for(const p of s.game.players)pm.collectionVariables.set('hunter_'+p.role,p.id);}pm.test('night result',()=>{const p=id=>s.game.players.find(p=>p.id===pm.collectionVariables.get(id));pm.expect(p('hunter_hunter').alive).eq(true);pm.expect(p('hunter_wolf').alive).eq(false);pm.expect(s.game.events.filter(e=>e.audience==='public').some(e=>['hunter-marked','hunter-fired','hunter-shot'].includes(e.type))).eq(false);});"
    }
  ],
  "body": {
    "type": "json",
    "content": "{\"type\": \"command\", \"stepId\": \"{{hunterStep}}\", \"command\": {\"type\": \"publish\"}, \"code\": \"{{hunterCode}}\", \"requestId\": \"hunter-44\"}"
  }
}
