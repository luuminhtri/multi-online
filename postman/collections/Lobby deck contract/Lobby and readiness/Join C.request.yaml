$kind: http-request
name: "Join C"
order: 400
method: POST
url: "{{baseUrl}}/api/room"
auth:
  type: noauth
headers:
  Content-Type: application/json
  Authorization: "Bearer {{lobbyTokenC}}"
body:
  type: json
  content: |-
    {
      "type": "join",
      "requestId": "join-C",
      "code": "{{lobbyCode}}",
      "name": "C"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('lobbyRevision', pm.response.json().room.revision);
