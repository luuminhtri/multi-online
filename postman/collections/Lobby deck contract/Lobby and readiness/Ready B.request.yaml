$kind: http-request
name: "Ready B"
order: 1300
method: POST
url: "{{baseUrl}}/api/room"
auth:
  type: noauth
headers:
  Content-Type: application/json
  Authorization: "Bearer {{lobbyTokenB}}"
body:
  type: json
  content: |-
    {
      "type": "ready",
      "requestId": "ready-B",
      "code": "{{lobbyCode}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
