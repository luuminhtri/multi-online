$kind: http-request
name: "Retry publish is idempotent"
order: 800
method: POST
url: "{{baseUrl}}/api/room"
auth:
  type: noauth
headers:
  Content-Type: application/json
  Authorization: "Bearer {{lobbyTokenowner}}"
body:
  type: json
  content: |-
    {
      "type": "setDeck",
      "requestId": "publish-deck",
      "code": "{{lobbyCode}}",
      "expectedRevision": {{publishRevision}},
      "roles": [
        "wolf",
        "witch",
        "villager"
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('lobbyRevision', pm.response.json().room.revision);
