$kind: http-example
name: Storage unavailable or conflicts exhausted; retry the same requestId and exact body
request:
  url: "{{baseUrl}}/api/room"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "type": {},
        "requestId": "jxi9V5lZ5Y-1eDfGmRkpGdVYrNkDJ52ApBy7njvyiRZU8GpasiLgPoeURYp7dWjWb0EB11Z2DZNyXFP31iSo073B3EXJw3OznntpWmWIg0U",
        "name": "string"
      }
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "string",
          "message": "string",
          "retryable": true
        }
      }
order: 8000
