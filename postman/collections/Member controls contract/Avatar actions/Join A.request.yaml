$kind: http-request
name: "Join A"
order: 200
method: POST
url: "{{baseUrl}}/api/room"
auth:
  type: noauth
headers:
  Content-Type: application/json
  Authorization: "Bearer {{memberTokenA}}"
body:
  type: json
  content: |-
    {
      "type": "join",
      "requestId": "join-A",
      "code": "{{memberCode}}",
      "name": "A"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.collectionVariables.set('memberRevision',pm.response.json().room.revision);
