$kind: http-request
name: "Ready E"
order: 1200
method: POST
url: "{{baseUrl}}/api/room"
auth:
  type: noauth
headers:
  Content-Type: application/json
  Authorization: "Bearer {{memberTokenE}}"
body:
  type: json
  content: |-
    {
      "type": "ready",
      "requestId": "ready-E",
      "code": "{{memberCode}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
