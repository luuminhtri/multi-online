$kind: http-request
name: "Retry withdrawal"
order: 2000
method: POST
url: "{{baseUrl}}/api/room"
auth:
  type: noauth
headers:
  Content-Type: application/json
  Authorization: "Bearer {{memberTokenowner}}"
body:
  type: json
  content: |-
    {
      "type": "removeMember",
      "requestId": "leave-game",
      "code": "{{memberCode}}",
      "expectedRevision": {{leaveRevision}},
      "playerId": "{{memberhunterId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.collectionVariables.set('memberRevision',pm.response.json().room.revision);
