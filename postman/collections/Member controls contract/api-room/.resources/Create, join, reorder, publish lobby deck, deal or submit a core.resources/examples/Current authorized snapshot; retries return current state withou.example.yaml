$kind: http-example
name: Current authorized snapshot; retries return current state without applying twice. Create is idempotent by token+requestId. Join preserves the same member. Start never reshuffles on retry. Core commands are rebased on fresh state after CAS conflicts.
request:
  url: "{{baseUrl}}/api/room"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "type": {},
        "requestId": "CHsWvYfIbmr-02ufToB2pEmlcOfGWZIXdueOQsIHrAWF7HLR7q2CS-2lxqx-u6io5Zm5bIcpmsVJiI1DODCIGFySh4KlvYhBCuzw",
        "name": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "room": {},
        "me": {},
        "viewer": "string",
        "game": {},
        "viewVersion": "string",
        "storage": "string",
        "serverTime": "2017-11-08T00:15:37.629Z",
        "catalog": [
          {
            "id": "string",
            "name": "string",
            "description": "string",
            "image": "string"
          },
          {
            "id": "string",
            "name": "string",
            "description": "string",
            "image": "string"
          }
        ],
        "deck": {
          "key_0": 3238
        },
        "controller": {}
      }
order: 1000
