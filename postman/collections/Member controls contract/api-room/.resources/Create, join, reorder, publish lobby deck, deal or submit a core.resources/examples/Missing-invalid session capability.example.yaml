$kind: http-example
name: Missing/invalid session capability
request:
  url: "{{baseUrl}}/api/room"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "type": {},
        "requestId": "CHsWvYfIbmr-02ufToB2pEmlcOfGWZIXdueOQsIHrAWF7HLR7q2CS-2lxqx-u6io5Zm5bIcpmsVJiI1DODCIGFySh4KlvYhBCuzw",
        "name": "string"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "string",
          "message": "string",
          "retryable": true
        }
      }
order: 3000
