$kind: http-request
name: 'Join C'
method: POST
url: '{{baseUrl}}/api/room'
auth:
  type: noauth
headers:
  Content-Type: application/json
  Authorization: 'Bearer {{testTokenC}}'
order: 400
body:
  type: json
  content: |-
    {
      "type": "join",
      "requestId": "join-C",
      "code": "{{testCode}}",
      "name": "C"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Join player', () => pm.response.to.have.status(200));
