$kind: http-request
name: 'Player cannot choose settings'
method: POST
url: '{{baseUrl}}/api/room'
auth:
  type: noauth
headers:
  Content-Type: application/json
  Authorization: 'Bearer {{testTokenA}}'
order: 500
body:
  type: json
  content: |-
    {
      "type": "start",
      "requestId": "start-settings",
      "code": "{{testCode}}",
      "expectedRevision": 3,
      "roles": [
        "wolf",
        "witch",
        "villager"
      ],
      "settings": {
        "witchSeesBite": false
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Moderator required', () => { pm.response.to.have.status(403); pm.expect(pm.response.json().error.code).to.eql('MODERATOR_REQUIRED'); });
