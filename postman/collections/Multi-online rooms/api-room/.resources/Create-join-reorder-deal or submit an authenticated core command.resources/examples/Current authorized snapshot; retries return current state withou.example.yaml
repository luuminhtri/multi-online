$kind: http-example
name: Current authorized snapshot; retries return current state without applying twice. Create is idempotent by token+requestId. Join preserves the same member. Start never reshuffles on retry. Core commands are rebased on fresh state after CAS conflicts.
request:
  url: "{{baseUrl}}/api/room"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "type": {},
        "requestId": "a8tf-dCkr_9OIbc1gNmrsGBcwk8QrBBP6T4UHB_Q",
        "name": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "room": {},
        "me": {},
        "viewer": "string",
        "game": {},
        "viewVersion": "string",
        "storage": "string",
        "serverTime": "1975-09-26T03:21:26.779Z",
        "catalog": []
      }
order: 1000
