$kind: http-example
name: Stale lobby revision/step, invalid game action, or lobby already started
request:
  url: "{{baseUrl}}/api/room"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "type": {},
        "requestId": "a8tf-dCkr_9OIbc1gNmrsGBcwk8QrBBP6T4UHB_Q",
        "name": "string"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "string",
          "message": "string",
          "retryable": false
        }
      }
order: 6000
