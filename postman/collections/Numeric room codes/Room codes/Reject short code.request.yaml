{
  "$kind": "http-request",
  "name": "Reject short code",
  "order": 400,
  "method": "GET",
  "url": "{{baseUrl}}/api/room?code=12345",
  "auth": {
    "type": "noauth"
  },
  "headers": [
    {
      "key": "Authorization",
      "value": "Bearer {{numericToken}}"
    },
    {
      "key": "Content-Type",
      "value": "application/json"
    }
  ],
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('HTTP 400',()=>pm.response.to.have.status(400));pm.test('INVALID_ROOM_CODE',()=>pm.expect(pm.response.json().error.code).eql('INVALID_ROOM_CODE'));"
    }
  ],
  "queryParams": [
    {
      "key": "code",
      "value": "12345"
    }
  ]
}
