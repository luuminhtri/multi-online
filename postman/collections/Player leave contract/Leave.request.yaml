$kind: http-request
name: Leave
order: 4000
method: POST
url: "{{baseUrl}}/api/room"
headers:
  Content-Type: application/json
  Authorization: "Bearer {{guest}}"
body:
  type: json
  content: |
    {"type": "leave", "requestId": "leave-once", "code": "{{room}}"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));pm.test('Only receipt, no secrets',()=>pm.expect(pm.response.json()).to.eql({left:true,code:pm.collectionVariables.get('room')}));
