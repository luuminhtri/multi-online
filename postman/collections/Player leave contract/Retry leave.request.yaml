$kind: http-request
name: Retry leave
order: 5000
method: POST
url: "{{baseUrl}}/api/room"
headers:
  Content-Type: application/json
  Authorization: "Bearer {{guest}}"
body:
  type: json
  content: |
    {"type": "leave", "requestId": "leave-once", "code": "{{room}}"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));pm.test('Retry acknowledged',()=>pm.expect(pm.response.json().left).to.eql(true));
