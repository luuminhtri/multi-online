$kind: http-request
name: "Acknowledge offline B"
order: 800
method: POST
url: "{{baseUrl}}/api/room"
auth:
  type: noauth
headers:
  Content-Type: application/json
  Authorization: "Bearer {{sharedTokenowner}}"
body:
  type: json
  content: |-
    {
      "type": "offlineReady",
      "requestId": "ready-B",
      "code": "{{sharedCode}}",
      "playerId": "{{sharedBId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('Scoped acknowledgement',()=>pm.expect(pm.response.json().me.id).to.eql(pm.collectionVariables.get('sharedBId')));
