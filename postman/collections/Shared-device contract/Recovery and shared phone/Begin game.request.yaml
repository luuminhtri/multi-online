$kind: http-request
name: "Begin game"
order: 1200
method: POST
url: "{{baseUrl}}/api/room"
auth:
  type: noauth
headers:
  Content-Type: application/json
  Authorization: "Bearer {{sharedTokenowner}}"
body:
  type: json
  content: |-
    {
      "type": "begin",
      "requestId": "begin",
      "code": "{{sharedCode}}",
      "expectedRevision": {{sharedRevision}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.collectionVariables.set('sharedStep',pm.response.json().game.stepId);
