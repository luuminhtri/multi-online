$kind: http-request
name: "Join phone A"
order: 200
method: POST
url: "{{baseUrl}}/api/room"
auth:
  type: noauth
headers:
  Content-Type: application/json
  Authorization: "Bearer {{sharedTokenA}}"
body:
  type: json
  content: |-
    {
      "type": "join",
      "requestId": "join-a",
      "code": "{{sharedCode}}",
      "name": "A"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.collectionVariables.set('sharedRevision',pm.response.json().room.revision);
      pm.collectionVariables.set('sharedAId',pm.response.json().me.id);
