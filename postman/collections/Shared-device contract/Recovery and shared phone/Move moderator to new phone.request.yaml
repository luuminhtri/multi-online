$kind: http-request
name: "Move moderator to new phone"
order: 1500
method: POST
url: "{{baseUrl}}/api/room"
auth:
  type: noauth
headers:
  Content-Type: application/json
  Authorization: "Bearer {{sharedTokennewOwner}}"
body:
  type: json
  content: |-
    {
      "type": "join",
      "requestId": "recover-host",
      "code": "{{sharedCode}}",
      "name": "Host network"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('Moderator resumed',()=>pm.expect(pm.response.json().viewer).to.eql('moderator'));
