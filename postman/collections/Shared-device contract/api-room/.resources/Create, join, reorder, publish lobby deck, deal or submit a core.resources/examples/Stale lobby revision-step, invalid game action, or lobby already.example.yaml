$kind: http-example
name: Stale lobby revision/step, invalid game action, or lobby already started
request:
  url: "{{baseUrl}}/api/room"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "type": {},
        "requestId": "M0erOtuFRVa05FAobqnqbYIqE2kB4vytNF_qMAfw8Cfc1sUJOUj6an1ocNNABGAfdeqB_Y1vqnk25XvZT",
        "name": "string"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "string",
          "message": "string",
          "retryable": true
        }
      }
order: 6000
